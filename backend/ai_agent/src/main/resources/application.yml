spring:
  flyway:
    enabled: true
    validate-migration-naming: true
  datasource:
    url: jdbc:mysql://localhost:3308/ai_agent?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

app:
  cache:
    query-ttl-seconds: ${QUERY_CACHE_TTL_SECONDS:60}

logging:
  level:
    org.flywaydb: DEBUG
