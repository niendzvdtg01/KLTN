spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:ai_agent_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false

app:
  cache:
    query-ttl-seconds: 60
