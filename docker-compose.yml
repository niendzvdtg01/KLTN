services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql_agent
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ai_agent
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234}
    ports:
      - "${MYSQL_PORT:-3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: redis_agent
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend/ai_agent
    container_name: ai_agent_backend
    restart: unless-stopped
    depends_on:
      mysql-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/ai_agent?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUERY_CACHE_TTL_SECONDS: ${QUERY_CACHE_TTL_SECONDS:-60}
      AGENT_BASE_URL: ${AGENT_BASE_URL:-http://agent:8001}
      AGENT_API_KEY: ${AGENT_API_KEY:-mock-ai-agent-key}
      SERVER_PORT: 8081
    ports:
      - "${BACKEND_PORT:-8081}:8081"

  agent:
    build:
      context: ./agent
    container_name: ai_agent_rules
    restart: unless-stopped
    env_file:
      - ./agent/.env
    environment:
      AGENT_API_KEY: ${AGENT_API_KEY:-mock-ai-agent-key}
      AGENT_CORS_ORIGINS: ${AGENT_CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${AGENT_PORT:-8001}:8001"

  frontend:
    build:
      context: ./text-to-sql-agent
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8081}
    container_name: ai_agent_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8081}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  mysql_data:
  redis_data:
